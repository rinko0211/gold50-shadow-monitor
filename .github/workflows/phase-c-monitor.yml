name: Gold50 Phase C Archive Verification

on:
  push:
    branches:
      - main
      - 'security/archive-phasec-2026-09-23'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'phase-c/status.json'
      - '.github/workflows/phase-c-monitor.yml'
      - 'PHASE_C_PREREGISTRATION_AMENDMENT_02.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold50-phase-c-archive
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify frozen mapper and archive controls
        run: npm test
      - name: Verify frozen Phase C completion evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status=JSON.parse(fs.readFileSync('phase-c/status.json','utf8'));
          if(status.counter!=='C10/10') throw new Error('Phase C archive counter drift');
          if(status.successfulSessions!==10||status.targetSessions!==10) throw new Error('Phase C archive session count drift');
          if(status.phaseCState!=='COMPLETE_STOP_GATE') throw new Error('Phase C archive is not stopped');
          if(status.productionAuthority!==false||status.brokerOrderAllowed!==false) throw new Error('Unexpected Production/broker authority');
          if(status.rawTiingoDataPersisted!==false) throw new Error('Unexpected raw Tiingo persistence');
          const latest=status.latestObservation;
          if(!latest||latest.replayVerified!==true||latest.authorityInvariantPass!==true) throw new Error('Final Phase C replay/authority evidence invalid');
          if(latest.authority!=='NONE_SHADOW_ONLY'||latest.brokerOrderAllowed!==false) throw new Error('Final Phase C authority drift');
          console.log('Gold50 Phase C archive: C10/10 / COMPLETE_STOP_GATE / NONE_SHADOW_ONLY');
          NODE
