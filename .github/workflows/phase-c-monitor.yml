name: Gold50 Phase C Shadow Monitor

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/phase-c-monitor.yml'
      - 'PHASE_C_PREREGISTRATION_AMENDMENT_02.md'
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * 1-5'
    - cron: '45 0 * * 2-6'
    - cron: '45 3 * * 2-6'
    - cron: '45 6 * * 2-6'
    - cron: '45 9 * * 2-6'
    - cron: '45 12 * * 2-6'

permissions:
  contents: write

concurrency:
  group: gold50-phase-c-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen mapper and Phase C adapter
        run: npm test
      - name: Run isolated Phase C observation
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
        run: npm run phasec:run
      - name: Assert no raw Tiingo values are persisted
        shell: bash
        run: |
          test -f phase-c/status.json
          ! grep -R -E '"(open|high|low|close)"[[:space:]]*:' phase-c
          ! grep -R 'gldClose' phase-c
      - name: Persist sanitized Phase C evidence only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phase-c/observations.jsonl phase-c/status.json
          if git diff --cached --quiet; then
            echo "No Phase C evidence change"
            exit 0
          fi
          git commit -m "Record Gold50 Phase C observation"
          git pull --rebase origin main
          git push origin HEAD:main
