name: Gold50 Phase C Shadow Monitor

on:
  push:
    branches:
      - main
      - 'audit/rate-regime-2026-09-23'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/phase-c-monitor.yml'
      - 'PHASE_C_PREREGISTRATION_AMENDMENT_02.md'
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * 1-5'
    - cron: '45 0 * * 2-6'
    - cron: '45 3 * * 2-6'
    - cron: '45 6 * * 2-6'
    - cron: '45 9 * * 2-6'
    - cron: '45 12 * * 2-6'

permissions:
  contents: write

concurrency:
  group: gold50-phase-c-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen mapper and Phase C adapter
        run: npm test
      - name: Run isolated Phase C observation
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
        run: npm run phasec:run
      - name: Assert no raw Tiingo values are persisted
        shell: bash
        run: |
          test -f phase-c/status.json
          ! grep -R -E '"(open|high|low|close)"[[:space:]]*:' phase-c
          ! grep -R 'gldClose' phase-c
      - name: Persist sanitized Phase C evidence only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phase-c/observations.jsonl phase-c/status.json
          if git diff --cached --quiet; then
            echo "No Phase C evidence change"
            exit 0
          fi
          git commit -m "Record Gold50 Phase C observation"
          git pull --rebase origin main
          git push origin HEAD:main

  rate-regime-audit:
    if: github.ref == 'refs/heads/audit/rate-regime-2026-09-23'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run Tiingo-backed rate-regime replay
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
        run: node src/rate-regime-audit.mjs
      - name: Assert sanitized evidence and zero authority
        shell: bash
        run: |
          test -f audit/rate-regime-2026-09-23.json
          ! grep -E '"(open|high|low|close)"[[:space:]]*:' audit/rate-regime-2026-09-23.json
          node -e 'const x=require("./audit/rate-regime-2026-09-23.json"); if(x.productionAuthority!==false||x.brokerOrderAllowed!==false||x.source.rawGldPersisted!==false||x.referenceCheck.pass!==true) process.exit(1)'
      - name: Persist sanitized audit evidence on audit branch only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/rate-regime-2026-09-23.json
          git commit -m "Record Gold50 rate-regime audit evidence"
          git push origin HEAD:audit/rate-regime-2026-09-23
