name: Post-Soak Security Hardening CI

on:
  push:
    branches:
      - 'security/hardening-post-soak-2026-09-23'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold50-post-soak-security-hardening
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm test
